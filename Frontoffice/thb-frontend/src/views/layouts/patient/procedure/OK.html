import router from '@/router/index.js'
import vSelect from 'vue-select'

export default {
    name: 'DoctorStudies',
    components: {
        patientMenu, administration, vSelect
    },
    data() {
        return {
            type_costing_c_id:16,
            open_modal: {
                procedure: false,
                add_list: false,
                edit_list: false,
                remove_list: false,
            },
            OptionsType:[
                {value:1,title:'Dokter'},
                {value:2,title:'Anestesi'},
                {value:3,title:'Asisten Operator'}
            ],
            userData: JSON.parse(localStorage.getItem('userData')),
            regData: {},
            doctor: {
                fields: [
                    { key: 'tanggal', label: 'Tanggal & Jam' },
                    { key: 'tindakan', label: 'Tindakan Dokter' },
                    { key: 'notes', label: 'Keterangan' },
                    { key: 'action', label: 'Aksi' }

                items: []
            },
            form_transaction: {
                id:'',
                view:'add',
                costing_id:'',
                type:1,
                operator_in_charge_id_1:'',
                anestesi_in_charge_id_1:'',
                anestesi_in_charge_id_2:'',
                operator_in_charge_id_2:'',

                notes:'',

            }
        }
    },
    filters:{
        currency(value) {
            return new Intl.NumberFormat("en-US", { style: "currency", currency: "IDR" }).format(value)
        }
    },
    computed: {
        ...mapState({ 
            items: state => state.soap.items, 
            itemsTransaction: state => state.soap.itemstransaction, 
            TypeCostingOptions: state => state.helper.options.typecostingc,
            fieldsTransaction: state => state.soap.fieldstransaction,

    methods: {
        onAddTYPE (event) {
            const inpatient_id = "40f06534-07ec-4221-ad9d-dea08196079f"
            const inpatient_item_id = "d158a64e-6246-444a-97b7-8d0a2d90e53a"
            let company_insurance_id = "e5a1e978-af77-4901-9ef8-4ebaeee77dfa"
            let service_class_id = "e5a1e978-af77-4901-9ef8-4ebaeee77dfa"
            let paramsInsuranceServiceClassDoctor = {}

            console.log(this.regData.registration_insurance[0].company_id)

            if (this.regData.registration_insurance[0].company_id === '1a055e0f-1b9d-42d2-bb84-7d8bf82fc4b8') {
                company_insurance_id = this.regData.registration_insurance[0].company_id
                service_class_id = this.regData.registration_insurance[0].service_class_id
            } else if (this.regData.registration_insurance[0].company_id === 'bb0d633f-99e1-4990-901b-0417a14e3cb6') {
                company_insurance_id = this.regData.registration_insurance[0].company_id
                service_class_id = this.regData.registration_insurance[0].service_class_id
            } else {
                company_insurance_id = "e5a1e978-af77-4901-9ef8-4ebaeee77dfa"
                service_class_id = this.regData.registration_insurance[0].service_class_id
            }
            // list.is_primary === 1 && list.company_id === '1a055e0f-1b9d-42d2-bb84-7d8bf82fc4b8'"

            if (this.regData.health_facility_id === inpatient_id) {
                paramsInsuranceServiceClassDoctor = {
                    classification_one_type_id: this.type_costing_c_id,
                    company_insurance_id: company_insurance_id,
                    service_class_id: service_class_id ? service_class_id : this.regData.service_class_id
                }
            } else {
                paramsInsuranceServiceClassDoctor = {
                    classification_one_type_id: this.type_costing_c_id,
                    company_insurance_id: company_insurance_id,
                    health_facility_item_id: this.regData.health_facility_item_id
                }
            }
            console.log(paramsInsuranceServiceClassDoctor)
            this.$store.dispatch('costing/getParam', paramsInsuranceServiceClassDoctor)
        },
        refresh () {
            router.go(router.currentRoute)
        },
        getData (id) {
            this.$store.dispatch('registration/getById', id).then(data => {
                this.regData = data[0]
                this.onAddTYPE({title:'Rawat Inap',value:16})

                // if (this.regData.health_facility_id === "40f06534-07ec-4221-ad9d-dea08196079f") {
                //     this.$store.dispatch('costing/getParam', {type_costing_id:3,service_class_id:this.regData.service_class_id,health_facility_item_id:'d158a64e-6246-444a-97b7-8d0a2d90e53a'})
                // } else {
                //     this.$store.dispatch('costing/getParam', {type_costing_id:3,service_class_id:this.regData.service_class_id})
                // }


                console.log(data[0])
                this.$store.dispatch('soap/getByIdTransaction', this.regData.registration_id)
                // this.form_nurse.employee_nurse_id = this.userData.employee_id
                // this.form_nurse.registration_destination_id = id
                // this.show = false
            })
        },
        validationFormTransaction (id) {
            // this.$refs.simpleRules.validate()
            // .then(success => {
            //     if (success) {
                const formData = {
                    id:this.form_transaction.id,
                    view:this.form_transaction.view,
                    costing_id:this.form_transaction.costing_id.value,
                    soap_id:this.form_transaction.soap_id,
                    doctor_in_charge_id:this.form_transaction.doctor_in_charge_id,
                    registration_destination_id:this.form_transaction.registration_destination_id,
                    notes:this.form_transaction.notes,
                    var_1:this.form_transaction.costing_id.costing,
                    var_2:this.form_transaction.var_2,
                    var_3:this.form_transaction.costing_id.costing*this.form_transaction.var_2
                }
                this.$store.dispatch('soap/formPostPutTransaction', formData)
                .then(res => {
                    this.modalShow = false
                    this.open_modal.procedure = !this.open_modal.procedure
                    this.notification('Success','CheckIcon','success','You have successfully')
                    this.$store.dispatch('soap/getById', this.$route.params.id)
                    this.$store.dispatch('soap/getByIdTransaction', this.regData.registration_id)
                }, 
                err => {
                    this.notification('Failed','CloseIcon','danger','You have unsuccessful')
                })
                // } else {
                // this.notification('Failed','CloseIcon','danger','You have unsuccessful')
                // }
            // })
        },
        rowOnDelete (id) {
            this.$bvModal
                .msgBoxConfirm('Please confirm that you want to delete everything.', {
                title: 'Please Confirm', size: 'sm', okVariant: 'primary', okTitle: 'Yes', cancelTitle: 'No', cancelVariant: 'outline-secondary', hideHeaderClose: false, centered: true,
            })
            .then(value => {
                if (value === true){
                this.$store.dispatch('soap/remove', id)
                .then(response => {
                    if (response.status === 200) {
                    this.$store.dispatch('soap/getById', this.$route.params.id)
                    this.$store.dispatch('soap/getByIdTransaction', this.regData.registration_id)
                    this.notification('Success','CheckIcon','success','You have successfully')
                    } else {
                    this.notification('Failed','CloseIcon','danger','You have unsuccessful')
                    }
                },
                error => {
                    this.notification('Failed','CloseIcon','danger','You have unsuccessful')
                }) 
                }
            })
        },
        openModalTransaction (view,id) {
            if (view === 'add') {
                this.open_modal.procedure = !this.open_modal.procedure
                this.form_transaction.soap_id = null
                this.form_transaction.registration_destination_id = this.regData.registration_destination_id
                this.form_transaction.view = view
            } else {
                this.open_modal.procedure = !this.open_modal.procedure
                this.form_transaction.id = id.id
                this.form_transaction.view = view
                this.form_transaction.costing_id = {
                    value: id.costing_id,
                    title: id.costing_name,
                    costing: id.var_2
                }
                this.form_transaction.doctor_in_charge_id = id.doctor_in_charge_id
                this.form_transaction.notes = id.notes
                this.form_transaction.var_1 = id.var_1
            }
        },
        notification (a,b,c,d) {
            this.$toast({
                component: ToastificationContent,
                employee: 'top-right',
                props: { title: a, icon: b, variant: c, text: d}
            })
        },
    },
    mounted () {
        this.$store.dispatch('employee/getParamAll')
        this.$store.dispatch('helper/getParam', 'costing_c_one')
        // this.$store.dispatch('costing/getParam', 3)
        this.$store.dispatch('soap/getById', this.$route.params.id)
        if (this.$route.params.id) {
            console.log(this.items)
            // this.show = true
            this.id = this.$route.params.id
            this.getData(this.$route.params.id)
        }
    }
}
